<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Analyzer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
</head>
<body class="dark">
    <!-- Burger Menu -->
    <div class="burger-menu" id="burgerMenu">☰</div>
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Search History</h3>
            <span class="close-btn" id="closeMenu">×</span>
        </div>
        <ul id="historyList"></ul>
        <button id="clearHistory">Clear History</button>
    </div>
    
    <!-- Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle">🌙</button>

    <div class="container">
        <header class="dynamic-header">
            <div class="title-container">
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" 
                     alt="GitHub Logo" 
                     class="github-logo">
                <h1 class="dynamic-title">PROFILE ANALYZER</h1>
                <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" 
                     alt="GitHub Logo" 
                     class="github-logo">
            </div>
            <div class="input-container">
                <input type="text" id="username" placeholder="Enter GitHub Username">
                <button id="submit">Search</button>
            </div>
           
        </header>
        
        <section id="profile-overview">
            <h2>Profile Overview</h2>
            <div id="profile"></div>
        </section>
        
        <section id="repo-details">
            <h2>Repository Details</h2>
            <div id="repositories"></div>
        </section>
        
        <section id="languages-used">
            <h2>Languages Used</h2>
            <canvas id="languagesChart"></canvas>
        </section>
        
        <div id="error"></div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>Connect with me:</p>
            <div class="social-icons">
                <a href="https://discord.com/HackHub_24" target="_blank"><i class="fab fa-discord"></i></a>
                <a href="https://instagram.com/ishfaqnazir_24" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://facebook.com/IsHfaqNazir" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://twitter.com/" target="_blank"><i class="fab fa-twitter"></i></a>
            </div>
            <p>Project by <a href="https://github.com/ishfaq24" target="_blank">ishfaq24</a></p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</body>
</html>
